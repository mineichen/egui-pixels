[workspace]
resolver = "3"
members = ["annotation-tool", "imanot"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
eframe = { version = "0.35", default-features = false }
egui = { version = "0.35", default-features = false }
emath = "0.35"
futures-core = "0.3"
image-0_25 = { package = "image", version = "0.25", default-features = false }
imbuf = "0.3"
imask = { git = "https://github.com/mineichen/imask.git" }
itertools = "0.15"
log = "0.4"
serde = { version = "1" }

